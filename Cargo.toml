[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/analysis",
    "crates/cli",
    "crates/formats",
    "crates/adapters",
    "crates/models",
    "crates/sandbox",
    "crates/deep",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Regrant-Dev/ByteBouncer"
rust-version = "1.85"

[workspace.dependencies]
bytebouncer-core = { path = "crates/core" }
bytebouncer-analysis = { path = "crates/analysis" }
bytebouncer-formats = { path = "crates/formats" }
bytebouncer-adapters = { path = "crates/adapters" }
bytebouncer-models = { path = "crates/models" }
bytebouncer-sandbox = { path = "crates/sandbox" }
bytebouncer-deep = { path = "crates/deep" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
